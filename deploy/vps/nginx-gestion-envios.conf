# Gestión de Envíos. Archivo propio: no modifica el sitio soderia.
# Dirección principal: gestionenvios.duckdns.org. La de sslip.io redirige a ella.
server {
    listen 80;
    listen [::]:80;
    server_name gestionenvios.duckdns.org envios.179-236-253-243.sslip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/gestion-envios-acme;
    }
    location / {
        return 301 https://gestionenvios.duckdns.org$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name envios.179-236-253-243.sslip.io;

    ssl_certificate /etc/letsencrypt/live/gestion-envios/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gestion-envios/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://gestionenvios.duckdns.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gestionenvios.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/gestion-envios/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gestion-envios/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/gestion-envios/front/dist;
    index index.html;
    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(self), camera=(self)" always;

    # API (servicio gestion-envios-api)
    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Archivos con hash: caché larga
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Aplicación de una sola página
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
