# Verificación del monorepo y actualización automática del esquema de Neon.
#
# - En cada push y pull request: lint, build y pruebas de front y back. La suite
#   del backend incluye una prueba que falla si se cambió `models.py` sin crear
#   la migración de Alembic (la causa de que Neon quedara desactualizada).
# - En cada push a `development` o `main`, si las verificaciones pasan, aplica
#   las migraciones pendientes a Neon. Requiere el secreto del repositorio
#   `NEON_DATABASE_URL` (Settings → Secrets and variables → Actions) con el
#   connection string de Neon tal como lo copia el panel. Sin el secreto, el
#   paso se omite y lo informa.
name: CI y esquema de Neon

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Back
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Back/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_URL: http://localhost:8000/api/v1
      - run: npm test

  actualizar-neon:
    needs: [backend, frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # Nunca dos migraciones a la vez contra la base compartida.
    concurrency:
      group: neon-esquema
      cancel-in-progress: false
    defaults:
      run:
        working-directory: Back
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Back/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Aplicar migraciones pendientes en Neon
        if: env.NEON_DATABASE_URL != ''
        run: python -m app.infrastructure.db.actualizar_base --database-url "$NEON_DATABASE_URL"
      - name: Informar que falta el secreto
        if: env.NEON_DATABASE_URL == ''
        run: echo "::warning::Falta el secreto NEON_DATABASE_URL; no se actualizó Neon."
